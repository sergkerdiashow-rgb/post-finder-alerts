name: Build Post Finder Alerts APK

on:
  push:
    branches: [ post-finder-alerts-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Export APK as small text chunks
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PostFinderAlerts.apk
          rm -rf apkparts
          mkdir -p apkparts
          base64 -w 0 PostFinderAlerts.apk | fold -w 3000 | split -l 1 -d -a 3 - apkparts/part_
          {
            echo -n "sha256="; sha256sum PostFinderAlerts.apk | awk '{print $1}'
            echo -n "size="; wc -c < PostFinderAlerts.apk
            echo -n "parts="; find apkparts -name 'part_*' | wc -l
          } > apkparts/manifest.txt
      - name: Commit transport chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PostFinderAlerts.apk apkparts
          git commit -m "Export PostFinderAlerts.apk small chunks [skip ci]"
          git push
