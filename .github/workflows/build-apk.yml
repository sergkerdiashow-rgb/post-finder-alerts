name: Build Post Finder Alerts APK

on:
  push:
    branches: [ post-finder-alerts-build ]
  pull_request:
    branches: [ post-finder-alerts-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build and export
        shell: bash
        run: |
          set +e
          gradle assembleDebug > build-status.log 2>&1
          rc=$?
          echo "exit_code=$rc" > build-status.txt
          if [ "$rc" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk PostFinderAlerts.apk
            echo "result=success" >> build-status.txt
            echo -n "sha256=" >> build-status.txt
            sha256sum PostFinderAlerts.apk | awk '{print $1}' >> build-status.txt
            echo -n "size=" >> build-status.txt
            wc -c < PostFinderAlerts.apk >> build-status.txt
          else
            echo "result=failed" >> build-status.txt
          fi
          tail -n 220 build-status.log > build-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-status.txt build-tail.txt
          if [ "$rc" -eq 0 ]; then git add -f PostFinderAlerts.apk; fi
          git commit -m "Build Post Finder Alerts 1.4 [skip ci]" || true
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:$branch" || true
          exit "$rc"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PostFinderAlerts-1.4
          path: PostFinderAlerts.apk
