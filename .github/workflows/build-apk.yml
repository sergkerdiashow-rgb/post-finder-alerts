name: Verify Post Finder Alerts

on:
  push:
    branches: [ post-finder-alerts ]
  pull_request:
    branches: [ post-finder-alerts ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify source build
        run: gradle assembleDebug

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostFinderAlerts-verification
          path: app/build/outputs/apk/debug/app-debug.apk

# Stable release publishing is intentionally disabled here.
# Production APKs must be signed with credentials stored outside the repository.
