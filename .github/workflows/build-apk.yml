name: Build Post Finder Alerts APK

on:
  push:
    branches: [ post-finder-alerts-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Copy APK to branch root
        run: cp app/build/outputs/apk/debug/app-debug.apk PostFinderAlerts.apk
      - name: Commit built APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PostFinderAlerts.apk
          git commit -m "Build PostFinderAlerts.apk [skip ci]"
          git push
