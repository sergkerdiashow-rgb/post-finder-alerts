name: Build Post Finder Alerts APK

on:
  push:
    branches: [ post-finder-alerts-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build and export
        shell: bash
        run: |
          set +e
          gradle assembleDebug > build-status.log 2>&1
          rc=$?
          echo "exit_code=$rc" > build-status.txt
          if [ "$rc" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk PostFinderAlerts.apk
            echo "result=success" >> build-status.txt
            echo -n "sha256=" >> build-status.txt
            sha256sum PostFinderAlerts.apk | awk '{print $1}' >> build-status.txt
            echo -n "size=" >> build-status.txt
            wc -c < PostFinderAlerts.apk >> build-status.txt
            python3 - <<'PY'
          import json, re, pathlib
          text = pathlib.Path('app/build.gradle').read_text()
          code = int(re.search(r'versionCode\s+(\d+)', text).group(1))
          name = re.search(r'versionName\s+"([^"]+)"', text).group(1)
          changes = pathlib.Path('app/update-changelog.txt').read_text().strip()
          data = {
              'versionCode': code,
              'versionName': name,
              'apk': 'https://github.com/sergkerdiashow-rgb/retro-platformer-android/raw/refs/heads/post-finder-alerts-build/PostFinderAlerts.apk',
              'changelog': changes,
          }
          pathlib.Path('latest.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          else
            echo "result=failed" >> build-status.txt
          fi
          tail -n 220 build-status.log > build-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-status.txt build-tail.txt latest.json 2>/dev/null || true
          if [ "$rc" -eq 0 ]; then git add -f PostFinderAlerts.apk; fi
          git commit -m "Build Post Finder Alerts 1.4 [skip ci]" || true
          git push
          exit "$rc"
